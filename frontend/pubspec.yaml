name: beautygo
description: BeautyGO - Marketplace de Serviços de Beleza
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  go_router: ^13.2.4
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.1.2
  mask_text_input_formatter: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
